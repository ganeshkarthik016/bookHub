services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run worker
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  mongo_data:
